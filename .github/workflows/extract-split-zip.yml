name: Extract Backup 7z Split Archive

on:
  workflow_dispatch:

jobs:
  extract:
    name: Extract Split 7z Files
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract Split 7z Archive
        shell: bash
        run: |
          FIRST_PART=$(find . -maxdepth 2 -name "app.7z.001" | head -n 1)

          if [ -z "$FIRST_PART" ]; then
            echo "::error:: app.7z.001 not found in the repository."
            exit 1
          fi

          if [ ! -f "$FIRST_PART" ]; then
            echo "::error:: File exists in search results, but is not a valid file: $FIRST_PART"
            exit 1
          fi

          TARGET_DIR=$(dirname "$FIRST_PART")
          BASENAME=$(basename "$FIRST_PART" .001)

          echo "Extracting $FIRST_PART into $TARGET_DIR..."

          7z x "$FIRST_PART" -o"$TARGET_DIR" -y

          echo "Removing split archive parts..."
          rm -f "$TARGET_DIR/$BASENAME".*

          echo "Extracted successfully and removed split parts."

      - name: Commit and Push Unzipped Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "chore: Extract app.7z split contents [skip ci]" || echo "No changes to commit"
          git push
